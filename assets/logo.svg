<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subway Hood logo">
  <defs>
    <linearGradient id="sh-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="1" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="sh-neon" x1="40" y1="40" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18e0ff"/>
      <stop offset="0.5" stop-color="#ff2d78"/>
      <stop offset="1" stop-color="#ffd400"/>
    </linearGradient>
    <filter id="sh-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="6" y="6" width="188" height="188" rx="44" fill="url(#sh-bg)" stroke="url(#sh-neon)" stroke-width="4"/>

  <!-- hood arch -->
  <path d="M52 150 C52 88 76 58 100 58 C124 58 148 88 148 150"
        fill="none" stroke="url(#sh-neon)" stroke-width="7" stroke-linecap="round" filter="url(#sh-glow)"/>
  <path d="M66 150 C66 100 82 76 100 76 C118 76 134 100 134 150"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- subway train front inside hood -->
  <g filter="url(#sh-glow)">
    <rect x="72" y="96" width="56" height="54" rx="12" fill="#12203a" stroke="#18e0ff" stroke-width="3"/>
    <rect x="80" y="104" width="16" height="16" rx="4" fill="#18e0ff"/>
    <rect x="104" y="104" width="16" height="16" rx="4" fill="#ff2d78"/>
    <rect x="84" y="130" width="32" height="9" rx="4.5" fill="#ffd400"/>
    <circle cx="84" cy="150" r="6" fill="#0a0a18" stroke="#ffd400" stroke-width="3"/>
    <circle cx="116" cy="150" r="6" fill="#0a0a18" stroke="#ffd400" stroke-width="3"/>
  </g>

  <!-- speed streaks -->
  <path d="M30 168 H62" stroke="#18e0ff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M138 168 H170" stroke="#ff2d78" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
</svg>
